<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>게시글 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container py-5" style="max-width:900px"><a th:href="@{/posts}">← 목록</a>
    <div class="card shadow-sm mt-3">
        <div class="card-body p-4">
            <div class="eyebrow" th:text="${#temporals.format(post.createdAt,'yyyy-MM-dd HH:mm')}">작성일</div>
            <h1 th:text="${post.title}">게시글 제목</h1>
            <p class="post-content" th:text="${post.content}">게시글 내용</p>
            <hr>
            <h5>첨부파일 <span class="text-secondary" th:text="${#lists.size(post.attachments)}">0</span></h5>
            <p class="text-secondary" th:if="${#lists.isEmpty(post.attachments)}">첨부파일이 없습니다.</p>
            <ul class="list-group" th:if="${!#lists.isEmpty(post.attachments)}">
                <li class="list-group-item attachment-item d-flex justify-content-between align-items-center"
                    th:each="file : ${post.attachments}">
                    <div>
                        <strong class="file-name" th:text="${file.originalFilename}">sample.pdf</strong>
                        <div class="file-meta mt-2">
                            <span class="file-type-badge" th:text="${file.contentType}">application/pdf</span>
                            <span class="file-size-badge"
                                  th:text="${file.fileSize / 1024} + ' KB'">100 KB</span>
                        </div>
                    </div>
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{/attachments/{id}/download(id=${file.id})}">파일 받기</a>
                </li>
            </ul>
            <div class="mt-3">
                <!-- STUDENT TODO: 이미지 파일이면 /attachments/{id}/view 경로를 사용해 미리보기 표시 -->

                <div class="image-preview mt-4"
                     th:each="file : ${post.attachments}"
                     th:if="${file.contentType == 'image/jpeg'
              or file.contentType == 'image/png'
              or file.contentType == 'image/gif'}">

                    <h5>이미지 미리보기</h5>

                    <img class="img-fluid rounded preview-image"
                         th:src="@{/attachments/{id}/view(id=${file.id})}"
                         th:alt="${file.originalFilename}">
                </div>
            </div>
            <div class="d-flex gap-2 mt-4"><a class="btn btn-outline-secondary"
                                              th:href="@{/posts/{id}/edit(id=${post.id})}">수정</a>
                <form method="post" onsubmit="return confirm('게시글을 삭제할까요?')"
                      th:action="@{/posts/{id}/delete(id=${post.id})}">
                    <button class="btn btn-outline-danger">삭제</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
