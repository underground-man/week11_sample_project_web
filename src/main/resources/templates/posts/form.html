<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>게시글 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container py-5" style="max-width:780px"><a th:href="@{/posts}">← 목록</a>
    <h1 class="mt-3" th:text="${postId == null ? '게시글 작성' : '게시글 수정'}">게시글 작성</h1>
    <form class="card p-4 shadow-sm" enctype="multipart/form-data"
          method="post" th:action="${postId == null ? '/posts' : '/posts/' + postId + '/edit'}"
          th:object="${postForm}"><label class="form-label mt-2">제목</label><input class="form-control"
                                                                                        maxlength="120"
                                                                                        required th:field="*{title}">
        <div class="text-danger" th:errors="*{title}"></div>
        <label class="form-label mt-3">내용</label><textarea class="form-control" required rows="6"
                                                           th:field="*{content}"></textarea>
        <div class="text-danger" th:errors="*{content}"></div>
        <div th:if="${postId == null}"><label class="form-label mt-3">첨부파일</label><input accept=".jpg,.jpeg,.png,.gif,.pdf,.txt"
                                                                                         class="form-control" multiple
                                                                                         name="files"
                                                                                         type="file">
            <div class="form-text">업로드 가능 확장자:JPG, PNG, GIF, PDF, TXT · 이외 파일은 업로드 거부됩니다· 각 파일당 최대 10MB만 가능합니다</div>
        </div>
        <div class="form-text mt-3" th:if="${postId != null}">수정에서는 제목과 본문만 변경합니다.</div>
        <div class="mt-4">
            <button class="btn btn-primary" type="submit">저장</button>
        </div>
    </form>
</main>
</body>
</html>
